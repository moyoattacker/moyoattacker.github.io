<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Posts - Moyo Attacker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MOYO<span>_</span>ATTACKER</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="blog.html">All Posts</a>
            <a href="index.html#contact">Contact</a>
        </div>
    </nav>

    <div class="container">
        <div class="blog-header">
            <h1>📚 All Blog Posts</h1>
            <p style="margin-top: 15px;">Total: <span id="post-count">0</span> artikel</p>
        </div>

        <div id="all-posts">
            <div style="text-align: center; padding: 50px;">🔄 Loading posts...</div>
        </div>

        <a href="index.html" class="back-button">← Back to Home</a>

        <footer>
            <p>&copy; 2025 Moyo Attacker</p>
        </footer>
    </div>

    <script>
        async function loadAllPosts() {
            try {
                const response = await fetch('posts.json');
                if (!response.ok) throw new Error('Gagal load posts.json');
                
                const data = await response.json();
                let posts = data.posts;
                
                // Urutkan dari terbaru
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                document.getElementById('post-count').innerText = posts.length;
                
                function formatDate(dateStr) {
                    const options = { year: 'numeric', month: 'long', day: 'numeric' };
                    return new Date(dateStr).toLocaleDateString('id-ID', options);
                }
                
                const container = document.getElementById('all-posts');
                let html = '';
                
                if (posts.length === 0) {
                    html = '<div style="text-align:center;padding:50px;">📭 Belum ada postingan.</div>';
                } else {
                    posts.forEach(post => {
                        html += `
                            <div class="post-card">
                                <div class="post-title">${post.title}</div>
                                <div class="post-meta">📅 ${formatDate(post.date)}</div>
                                <div class="post-excerpt">${post.excerpt}</div>
                                <a href="post.html?post=${post.file}" class="read-more">Baca →</a>
                            </div>
                        `;
                    });
                }
                
                container.innerHTML = html;
                
            } catch (error) {
                document.getElementById('all-posts').innerHTML = `
                    <div style="text-align:center;padding:50px;color:#ff3366;">
                        ❌ Error: ${error.message}<br>
                        <small>Pastikan file posts.json ada di root folder.</small>
                    </div>
                `;
            }
        }
        
        loadAllPosts();
    </script>
</body>
</html>
