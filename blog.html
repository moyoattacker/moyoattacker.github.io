<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Posts - Moyo Attacker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MOYO<span>_</span>ATTACKER</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="blog.html">All Posts</a>
            <a href="index.html#contact">Contact</a>
        </div>
    </nav>

    <div class="container">
        <div class="blog-header">
            <h1>📚 All Blog Posts</h1>
            <p style="margin-top: 15px;">Total: <span id="post-count">0</span> artikel</p>
        </div>

        <div id="all-posts"></div>

        <a href="index.html" class="back-button">← Back to Home</a>

        <footer>
            <p>&copy; 2025 Moyo Attacker</p>
        </footer>
    </div>

    <script>
        const posts = [
            { title: "Cara Memulai Ethical Hacking", date: "2026-05-25", file: "cara-hack-etis.md", excerpt: "Panduan lengkap untuk pemula..." },
            { title: "Setup Kali Linux", date: "2026-05-20", file: "setup-kali.md", excerpt: "Langkah-langkah install Kali Linux..." }
        ];
        
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));
        document.getElementById('post-count').innerText = posts.length;
        
        function formatDate(dateStr) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        }
        
        const container = document.getElementById('all-posts');
        let html = '';
        posts.forEach(post => {
            html += `
                <div class="post-card">
                    <div class="post-title">${post.title}</div>
                    <div class="post-meta">📅 ${formatDate(post.date)}</div>
                    <div class="post-excerpt">${post.excerpt}</div>
                    <a href="post.html?post=${post.file}" class="read-more">Baca →</a>
                </div>
            `;
        });
        container.innerHTML = html;
    </script>
</body>
</html>
