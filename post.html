<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moyo Attacker | Reading Post</title>
    <link rel="stylesheet" href="style.css">
    <!-- Markdown library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .post-content {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0,0,0,0.6);
            padding: 40px;
            border-radius: 15px;
        }
        .post-content img {
            max-width: 100%;
            border-radius: 8px;
        }
        .post-content pre {
            background: #0a0e27;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .post-content code {
            color: #ff88aa;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #00ff9d;
        }
        .error-msg {
            text-align: center;
            padding: 50px;
            color: #ff3366;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MOYO<span>_</span>ATTACKER</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
        </div>
    </nav>

    <div class="container">
        <div id="post-container">
            <div class="loading">⏳ Loading post...</div>
        </div>
        <a href="blog.html" class="back-button">← Back to All Posts</a>
    </div>

    <footer>
        <p>&copy; 2025 Moyo Attacker</p>
    </footer>

    <script>
        // Ambil nama file dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const postFile = urlParams.get('post');
        
        if (!postFile) {
            document.getElementById('post-container').innerHTML = '<div class="error-msg">❌ No post specified</div>';
        } else {
            // Fetch file markdown dari folder posting/
            fetch(`posting/${postFile}`)
                .then(response => {
                    if (!response.ok) throw new Error('Post not found');
                    return response.text();
                })
                .then(markdown => {
                    // Convert markdown ke HTML
                    const html = marked.parse(markdown);
                    document.getElementById('post-container').innerHTML = `
                        <div class="post-content">
                            ${html}
                        </div>
                    `;
                    
                    // Set judul halaman dari heading pertama
                    const firstHeading = document.querySelector('.post-content h1');
                    if (firstHeading) {
                        document.title = `${firstHeading.innerText} | Moyo Attacker`;
                    }
                })
                .catch(error => {
                    document.getElementById('post-container').innerHTML = `
                        <div class="error-msg">
                            ❌ Error: ${error.message}<br><br>
                            <small>File posting/${postFile} tidak ditemukan.</small><br><br>
                            <a href="blog.html" style="color:#00ff9d;">← Kembali ke Blog</a>
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
