<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moyo Attacker | Reading Document</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .post-content {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(0,0,0,0.6);
            padding: 50px;
            border-radius: 15px;
        }
        /* style lainnya sama seperti post.html */
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MOYO<span>_</span>ATTACKER</div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/blog.html">Blog</a>
        </div>
    </nav>

    <div class="container">
        <div id="post-container">
            <div class="loading">⏳ Loading document...</div>
        </div>
        <a href="javascript:history.back()" class="back-button">← Back</a>
    </div>

    <footer>
        <p>&copy; 2025 Moyo Attacker</p>
    </footer>

    <script>
        // Ambil path dari URL (tanpa parameter)
        let mdPath = window.location.pathname;
        
        // Jika path berakhiran .md, hapus .md dan cari file dengan ekstensi .md
        if (mdPath.endsWith('.html') || mdPath === '/' || mdPath === '') {
            document.getElementById('post-container').innerHTML = '<div class="error-msg">❌ Invalid document path</div>';
        } else {
            // Coba fetch file .md (hapus trailing slash jika ada)
            let mdFile = mdPath.replace(/\/$/, '') + '.md';
            
            fetch(mdFile)
                .then(response => {
                    if (!response.ok) throw new Error('Document not found');
                    return response.text();
                })
                .then(markdown => {
                    const html = marked.parse(markdown);
                    document.getElementById('post-container').innerHTML = `
                        <div class="post-content">
                            ${html}
                        </div>
                    `;
                    const firstHeading = document.querySelector('.post-content h1');
                    if (firstHeading) {
                        document.title = `${firstHeading.innerText} | Moyo Attacker`;
                    }
                })
                .catch(error => {
                    document.getElementById('post-container').innerHTML = `
                        <div class="error-msg">
                            ❌ Error: ${error.message}<br><br>
                            <small>File ${mdFile} tidak ditemukan.</small>
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
