name: Auto Update Posts

on:
  push:
    paths:
      - 'posting/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate posts.json
        run: |
          echo '{' > posts.json
          echo '  "posts": [' >> posts.json
          
          first=true
          for file in posting/*.md; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              title=$(head -n 1 "$file" | sed 's/^# //' | sed 's/"/\\"/g')
              date=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' "$file" | head -1)
              if [ -z "$date" ]; then
                date=$(date +%Y-%m-%d)
              fi
              excerpt=$(awk '/^[^#]/ && !/^>/ && length($0)>10 {print substr($0,1,150); exit}' "$file" | sed 's/"/\\"/g')
              if [ -z "$excerpt" ]; then
                excerpt="Baca selengkapnya di postingan ini"
              fi
              
              if [ "$first" = true ]; then
                first=false
              else
                echo ',' >> posts.json
              fi
              
              printf '    {\n' >> posts.json
              printf '      "title": "%s",\n' "$title" >> posts.json
              printf '      "date": "%s",\n' "$date" >> posts.json
              printf '      "file": "%s",\n' "$filename" >> posts.json
              printf '      "excerpt": "%s"\n' "$excerpt" >> posts.json
              printf '    }' >> posts.json
            fi
          done
          
          echo '' >> posts.json
          echo '  ]' >> posts.json
          echo '}' >> posts.json
          
          echo "Generated posts.json:"
          cat posts.json
          
      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || git commit -m "Auto-update posts.json"
          git push
