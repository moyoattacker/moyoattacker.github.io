<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moyo Attacker | Security Research</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .post-content {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0,0,0,0.85);
            padding: 40px;
            border-radius: 15px;
        }
        .post-content pre {
            background: #0a0e27;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
        .post-content code {
            color: #ff88aa;
        }
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            list-style: none;
            padding: 0;
        }
        .file-list li {
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #00ff9d;
        }
        .file-list a {
            color: #00ff9d;
            text-decoration: none;
        }
        .file-list a:hover {
            color: #ff3366;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MOYO<span>_</span>ATTACKER</div>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/blog.html">Blog</a>
        </div>
    </nav>

    <div class="container">
        <div id="content">
            <div class="loading" style="text-align:center; padding:50px;">⏳ Loading...</div>
        </div>
        <a href="javascript:history.back()" class="back-button" style="display:inline-block; margin-top:20px;">← Back</a>
    </div>

    <footer>
        <p>&copy; 2026 Moyo Attacker - Find The Bug, Own The Shell</p>
    </footer>

    <script>
        // Ambil parameter 'file' dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');
        
        if (fileName) {
            // Tampilkan file spesifik
            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(markdown => {
                    const html = marked.parse(markdown);
                    document.getElementById('content').innerHTML = `
                        <div class="post-content">
                            ${html}
                        </div>
                    `;
                    const firstHeading = document.querySelector('.post-content h1');
                    if (firstHeading) {
                        document.title = `${firstHeading.innerText} | Moyo Attacker`;
                    }
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `
                        <div class="error-msg" style="text-align:center; color:#ff3366;">
                            ❌ Error: ${error.message}<br>
                            <small>File ${fileName} tidak ditemukan.</small>
                        </div>
                    `;
                });
        } else {
            // Tampilkan daftar semua file .md (auto-detect)
            fetch('https://api.github.com/repos/moyoattacker/moyoattacker.github.io/contents/documentation/bounty')
                .then(response => response.json())
                .then(files => {
                    const mdFiles = files.filter(f => f.name.endsWith('.md')).sort();
                    let html = `
                        <div class="post-content">
                            <h1>📁 Security Research Archive</h1>
                            <p>Total: ${mdFiles.length} laporan keamanan</p>
                            <ul class="file-list">
                    `;
                    mdFiles.forEach(file => {
                        const title = file.name.replace('.md', '').replace(/-/g, ' ');
                        html += `<li><a href="?file=${file.name}">📄 ${title}</a></li>`;
                    });
                    html += `
                            </ul>
                        </div>
                    `;
                    document.getElementById('content').innerHTML = html;
                    document.title = 'Security Research Archive | Moyo Attacker';
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `
                        <div class="error-msg" style="text-align:center; color:#ff3366;">
                            ❌ Gagal memuat daftar file: ${error.message}
                        </div>
                    `;
                });
        }
    </script>
</body>
</html>
